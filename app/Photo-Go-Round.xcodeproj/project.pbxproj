				"# unsigned bundle — \"plug-ins outside containing apps must be protected by",
				"# SIP\". Measured 2026-09-15. See Build Plan.md.",
				"if [ \"${CONFIGURATION}\" != \"Debug\" ]; then",
				"    echo \"note: not installing in ${CONFIGURATION}; release installs from the app wrapper\"",
				"    exit 0",
				"fi",
				"APPEX=\"${BUILT_PRODUCTS_DIR}/Photo-Go-Round Wallpaper Host.app/Contents/Extensions/Photo-Go-Round Wallpaper.appex\"",
				"\"${SRCROOT}/../Scripts/install-wallpaper-extension.sh\" \"${APPEX}\"",
				"",
